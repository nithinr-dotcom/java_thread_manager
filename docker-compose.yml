# Demo stack for reviewers: PostgreSQL + the node (demo catalog and device keys) + the UI.
# Needs only Docker:  docker compose up --build   →  http://localhost:5173
# Ports taken?  BACKEND_PORT=8081 FRONTEND_PORT=5174 DB_PORT=55433 docker compose up --build
# `docker compose up db` alone gives the PostgreSQL that `./mvnw spring-boot:run` expects (port 55432).
# Production-style deployment is deploy/docker-compose.yml.
name: storefront-demo

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: storefront
    ports:
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront -d storefront"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      STOREFRONT_DB_URL: jdbc:postgresql://db:5432/storefront
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  web:
    build:
      context: frontend
      args:
        VITE_DEMO_API_KEY: sf_demo_manager
        NGINX_CONF: nginx.demo.conf
    depends_on: [app]
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
