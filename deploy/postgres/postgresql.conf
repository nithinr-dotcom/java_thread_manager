# Edge node PostgreSQL: durability over raw speed — this database is the only copy of fiscal records
# until they reach HQ. Never turn fsync/synchronous_commit off to "fix" latency.
listen_addresses = '*'
max_connections = 60
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
wal_compression = on
max_wal_size = 2GB

# Continuous WAL archiving → point-in-time recovery together with the base backups.
archive_mode = on
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
archive_timeout = 60

# Guard rails against runaway sessions (the app sets its own lock_timeout per checkout).
idle_in_transaction_session_timeout = 60s
statement_timeout = 30s

log_min_duration_statement = 500ms
log_lock_waits = on
log_checkpoints = on
deadlock_timeout = 1s
