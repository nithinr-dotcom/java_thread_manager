# TLS-terminating reverse proxy for the store LAN: serves the UI and forwards /api and health to the node.
# Certificates are mounted at /etc/nginx/tls (see docs/OPERATIONS.md).
server_tokens off;

upstream storefront_node {
    server app:8080;
    keepalive 32;
}

server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Live kitchen stream: no buffering, long-lived.
    location /api/v1/kitchen/stream {
        proxy_pass http://storefront_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://storefront_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }

    # Only health is exposed through the proxy; metrics are scraped on the node directly.
    location /actuator/health {
        proxy_pass http://storefront_node;
        proxy_set_header Host $host;    # the upstream name has an underscore, which Tomcat rejects as a Host
    }
}

server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
}
