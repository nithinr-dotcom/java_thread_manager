# Demo stack only (root docker-compose.yml): plain HTTP on localhost, no TLS. Production uses nginx.conf.
server_tokens off;

upstream storefront_node {
    server app:8080;
    keepalive 32;
}

server {
    listen 8080;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Live kitchen stream: no buffering, long-lived.
    location /api/v1/kitchen/stream {
        proxy_pass http://storefront_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://storefront_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    location /actuator/health {
        proxy_pass http://storefront_node;
        proxy_set_header Host $host;    # the upstream name has an underscore, which Tomcat rejects as a Host
    }
}
